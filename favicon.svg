<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Bright/Light Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Vibrant Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Wave Stroke Gradient (High-energy Blue -> Emerald -> Amber) -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="75%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Wave Soft Area Fill -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Card & Wave -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.16" />
    </filter>

    <filter id="waveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle (Bright Clean White-Cyan) -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Spiderweb / Quantitative Grid Lines (Bright Slate & Sky Blue) -->
  <!-- Horizontal Price Grid Levels -->
  <g stroke="#0284c7" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6,8">
    <line x1="60" y1="150" x2="452" y2="150" />
    <line x1="60" y1="210" x2="452" y2="210" />
    <line x1="60" y1="270" x2="452" y2="270" />
    <line x1="60" y1="330" x2="452" y2="330" />
    <line x1="60" y1="390" x2="452" y2="390" />
  </g>

  <!-- Spiderweb Radial Spokes -->
  <g stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.28">
    <!-- Center of Web at (256, 270) -->
    <line x1="256" y1="270" x2="256" y2="90" />
    <line x1="256" y1="270" x2="256" y2="450" />
    <line x1="256" y1="270" x2="76" y2="270" />
    <line x1="256" y1="270" x2="436" y2="270" />
    <line x1="256" y1="270" x2="128" y2="142" />
    <line x1="256" y1="270" x2="384" y2="398" />
    <line x1="256" y1="270" x2="128" y2="398" />
    <line x1="256" y1="270" x2="384" y2="142" />
  </g>

  <!-- Spiderweb Concentric Polygons / Octagons -->
  <g fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.26">
    <polygon points="256,210 298,227 316,270 298,312 256,330 213,312 196,270 213,227" />
    <polygon points="256,150 341,185 376,270 341,354 256,390 171,354 136,270 171,185" />
    <polygon points="256,90 383,142 436,270 383,397 256,450 128,397 76,270 128,142" />
  </g>

  <!-- Trend Volatility Area Fill -->
  <path d="M 80,410 L 80,350 Q 140,400 190,320 T 300,260 T 390,170 T 435,115 L 435,410 Z" 
        fill="url(#areaGrad)" />

  <!-- Main Volatility & Grid Wave Curve -->
  <path d="M 75,350 Q 140,400 190,320 T 300,260 T 390,170 T 435,115" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#waveShadow)" />

  <!-- Buy Order Signal Node (Vibrant Emerald at Trough) -->
  <g transform="translate(190, 320)">
    <circle cx="0" cy="0" r="24" fill="#10b981" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="16" fill="#059669" stroke="#ffffff" stroke-width="4" filter="url(#waveShadow)" />
    <polygon points="0,-7 -5,3 5,3" fill="#ffffff" />
  </g>

  <!-- Sell Order Signal Node (Vibrant Rose/Red at Peak) -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="24" fill="#f43f5e" fill-opacity="0.2" />
    <circle cx="0" cy="0" r="16" fill="#e11d48" stroke="#ffffff" stroke-width="4" filter="url(#waveShadow)" />
    <polygon points="0,7 -5,-3 5,-3" fill="#ffffff" />
  </g>

  <!-- High-Return Breakthrough Star (Bright Amber Gold at Top-Right) -->
  <g transform="translate(435, 115)">
    <circle cx="0" cy="0" r="26" fill="#f59e0b" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="17" fill="#d97706" stroke="#ffffff" stroke-width="4" filter="url(#waveShadow)" />
    <!-- 4-point Diamond Star -->
    <path d="M 0,-8 L 3,-2 L 9,0 L 3,2 L 0,8 L -3,2 L -9,0 L -3,-2 Z" fill="#ffffff" />
  </g>
</svg>
