<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Wave Glow Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Wave Shadow Gradient for Area -->
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Spiderweb / Quantitative Grid Lines -->
  <!-- Horizontal Price Grid Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="6,8">
    <line x1="60" y1="160" x2="452" y2="160" />
    <line x1="60" y1="220" x2="452" y2="220" />
    <line x1="60" y1="280" x2="452" y2="280" />
    <line x1="60" y1="340" x2="452" y2="340" />
    <line x1="60" y1="400" x2="452" y2="400" />
  </g>

  <!-- Spiderweb Radial Spokes -->
  <g stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.22">
    <!-- Center of Web at (256, 270) -->
    <line x1="256" y1="270" x2="256" y2="90" />
    <line x1="256" y1="270" x2="256" y2="450" />
    <line x1="256" y1="270" x2="76" y2="270" />
    <line x1="256" y1="270" x2="436" y2="270" />
    <line x1="256" y1="270" x2="128" y2="142" />
    <line x1="256" y1="270" x2="384" y2="398" />
    <line x1="256" y1="270" x2="128" y2="398" />
    <line x1="256" y1="270" x2="384" y2="142" />
  </g>

  <!-- Spiderweb Concentric Polygons / Octagons -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25">
    <polygon points="256,210 298,227 316,270 298,312 256,330 213,312 196,270 213,227" />
    <polygon points="256,150 341,185 376,270 341,354 256,390 171,354 136,270 171,185" />
    <polygon points="256,90 383,142 436,270 383,397 256,450 128,397 76,270 128,142" />
  </g>

  <!-- Trend Volatility Area Fill -->
  <path d="M 80,410 L 80,350 Q 140,400 190,320 T 300,260 T 390,170 T 435,115 L 435,410 Z" 
        fill="url(#areaGrad)" />

  <!-- Main Glowing Wave Line (ATR Volatility Pulse) -->
  <path d="M 75,350 Q 140,400 190,320 T 300,260 T 390,170 T 435,115" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Buy Order Signal Node (Emerald Pulse at Trough) -->
  <g transform="translate(190, 320)">
    <circle cx="0" cy="0" r="22" fill="#10b981" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="14" fill="#10b981" stroke="#ffffff" stroke-width="3.5" filter="url(#glow)" />
    <polygon points="0,-6 -4,2 4,2" fill="#ffffff" />
  </g>

  <!-- Sell Order Signal Node (Coral/Pink Pulse at Peak) -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="22" fill="#f43f5e" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="3.5" filter="url(#glow)" />
    <polygon points="0,6 -4,-2 4,-2" fill="#ffffff" />
  </g>

  <!-- High-Return Breakthrough Star at Top Right -->
  <g transform="translate(435, 115)" filter="url(#strongGlow)">
    <circle cx="0" cy="0" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>
</svg>
